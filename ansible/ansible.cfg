[defaults]
host_key_checking = False
inventory = ./inventory.yml
forks = 5
log_path = /var/log/ansible.log
roles_path = ./roles

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedKeyTypes=+ssh-rsa

