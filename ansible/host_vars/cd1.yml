router_id: "2.2.2.2"

vlans:
  - id: 10
    name: "Network Services"
  - id: 100
    name: "OOB Management"

interfaces:
  vlan:
    10:
      shutdown: false
      ipv4: "10.1.10.1"
      mask: "255.255.255.0"
      description: "SVI service gateway"
    100:
      shutdown: false
      ipv4: "192.168.100.11"
      mask: "255.255.255.0"
      description: "Management Ip"
  ethernet:
    0/0:
      shutdown: false
      switchport: "trunk"
      vlans: [100]
      description: "link to Bastion host"
    0/1:
      shutdown: false
      switchport: "none"
      nat: "none"
      ipv4: "10.1.1.1"
      mask: "255.255.254"
      description: "uplink to R1"
    0/2:
      shutdown: true
    0/3:
      shutdown: true
    1/0:
      shutdown: true
    1/1:
      shutdown: false
      switchport: trunk
      vlans: [10]
      description: "trunk port to acc1"
    1/2:
      shutdown: true
    1/3:
      shutdown: true
    2/0:
      shutdown: true
    2/1:
      shutdown: true
    2/2:
      shutdown: true
    2/3:
      shutdown: true
    3/0:
      shutdown: true
    3/1:
      shutdown: true
    3/2:
      shutdown: true
    3/3:
      shutdown: true

static_routes:
  - dest: "192.168.200.0"
    mask: "255.255.255.252"
    from: "192.168.200.1"

ospf_networks:
  - pid: 1
    area: 0
    network: "10.1.0.0"
    wildcard: "0.0.255.255"
