    0/2:
      shutdown: true
    0/3:
      shutdown: true
    1/0:
      shutdown: false
      switchport: "trunk"
      vlans: [100]
      description: "trunk to cd1"
    1/1/:
      shutdown: true
    1/2:
      shutdown: true
    1/3:
      shutdown: true
    2/0:
      shutdown: false
      switchport: "trunk"
      vlans: [100]
      description: "trunk to acc1"
    2/1:
      shutdown: true
    2/2:
      shutdown: true
    2/3:
      shutdown: true
    3/0:
      shutdown: true
    3/1:
      shutdown: true
    3/2:
      shutdown: true
    3/3:
      shutdown: true

static_routes:
  - dest: "192.168.100.254"
    mask: "255.255.255.255"
    from: "10.1.100.0"
