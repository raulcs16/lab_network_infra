router_id: "1.1.1.1"

vlans: []

interfaces:
  loopback:
    100:
      shutdown: false
      management: true
      ipv4: "192.168.100.254"
      mask: "255.255.255.255"
      description: "management id"
  ethernet:
    0/0:
      shutdown: true
    0/1:
      shutdown: false
      switchport: "none"
      nat: "inside"
      ipv4: "10.1.1.0"
      mask: "255.255.255.254"
      description: "p2p link to cd1"
    0/2:
      shutdown: true
    0/3:
      shutdown: true
    1/0:
      shutdown: true
    1/1:
      shutdown: true
    1/2:
      shutdown: false
      switchport: "none"
      nat: "inside"
      ipv4: "192.168.200.1"
      mask: "255.255.255.252"
      description: "OOB Connection to Bastion Host"
    1/3:
      shutdown: false
      switchport: "none"
      ipv4: "dhcp"
      mask: ""
      description: "WAN"
      nat: "outside"

static_routes:
  - dest: "192.168.200.0"
    mask: "255.255.255.252"
    from: "192.168.200.1"

access_list:
  - id: 1
    allow: permit
    network: "192.168.200.0"
    wild_card: "0.0.0.3"
  - id: 2
    allow: permit
    network: "10.1.0.0"
    wild_card: "0.0.255.255"

nat_list:
  - inport: "list 1"
    fwdport: "int eth 1/3"
  - inport: "static tcp 192.168.200.2 22"
    fwdport: "int eth 1/3 2222"
  - inport: "list 2"
    fwdport: "int eth 1/3 overload"

ospf_networks:
  - pid: 1
    area: 0
    network: "10.1.0.0"
    wildcard: "0.0.255.255"
