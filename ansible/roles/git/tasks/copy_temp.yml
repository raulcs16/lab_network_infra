- name: Ensure target ansible directory exists in user home
  file:
    path: "{{ target_path }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"

- name: Sync updated ansible files from temp clone to target destination
  ansible.posix.synchronize:
    src: "{{ temp_path }}/"
    dest: "{{ target_path }}/"
    delete: true
    archive: true
  delegate_to: "{{ inventory_hostname }}"
