- name: Configure VLAN IDS
  cisco.ios.ios_config:
    lines:
      - vlan "{{ item.id }}"
      - name "{{ item.name }}"
  loop: "{{ vlans }}"
  when: vlans is defined

- name: Configure access ethernet interfaces
  cisco.ios.ios_config:
    parents: "interface ethernet {{ item.key }}"
    lines:
      - switchport
      - description {{ item.value.description }}
      - switchport mode access
      - switchport access vlan {{ item.value.vlan }}
      - no shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', false) | selectattr('value.switchport','defined') |selectattr('value.switchport', 'equalto', 'access') | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0

- name: Configure trunk ethernet interfaces
  cisco.ios.ios_config:
    parents: "interface ethernet {{ item.key }}"
    lines:
      - switchport
      - description {{ item.value.description }}
      - switchport trunk encapsulation dot1q
      - switchport mode trunk
      - switchport trunk allowed vlan {{ item.value.vlans | join(',') }}
      - no shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', false) | selectattr('value.switchport','defined') | selectattr('value.switchport', 'equalto', 'trunk') | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0

- name: Configure No switchport ethernet interface
  cisco.ios.ios_config:
    parents: "interface ethernet {{ item.key }}"
    lines:
      - no switchport
      - description {{ item.value.description }}
      - ip address {{ item.value.ipv4 }} {{ item.value.mask }}
      - no shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', false) | selectattr('value.switchport','defined')| selectattr('value.switchport', 'equalto', 'none') | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0
