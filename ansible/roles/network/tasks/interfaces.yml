- name: configure loopbacks
  cisco.ios.ios_config:
    lines:
      - int loopback "{{ item.key }}"
        {% if item.value.shutdown == true %}
      - shutdown
      - description "{{ item.description }}"
      - ip add "{{ item.value.ipv4 }} {{ item.value.mask }}"
      - no shutdown
        {%endif}
  loop: "{{ interfaces.loopback | dict2items }}"
  when: interfaces.loopback is defined and interfaces.loopback | length > 0
