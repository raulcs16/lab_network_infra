- name: Configure and enable active loopbacks
  cisco.ios.ios_config:
    lines:
      - interface Loopback {{ item.key }}
      - description {{ item.value.description }}
      - ip address {{ item.value.ipv4 }} {{ item.value.mask }}
      - no shutdown
  loop: "{{ interfaces.loopback | dict2items | selectattr('value.shutdown', 'equalto', false) | list }}"
  when: interfaces.loopback is defined and interfaces.loopback | length > 0

- name: Shutdown specified loopbacks
  cisco.ios.ios_config:
    lines:
      - interface Loopback {{ item.key }}
      - shutdown
  loop: "{{ interfaces.loopback | dict2items | selectattr('value.shutdown', 'equalto', true) | list }}"
  when: interfaces.loopback is defined and interfaces.loopback | length > 0

- name: Configure and enable active VLAN interfaces
  cisco.ios.ios_config:
    lines:
      - interface Vlan{{ item.key }}
      - description {{ item.value.description }}
      - ip address {{ item.value.ipv4 }} {{ item.value.mask }}
      - no shutdown
  loop: "{{ interfaces.vlan | dict2items | selectattr('value.shutdown', 'equalto', false) | list }}"
  when: interfaces.vlan is defined and interfaces.vlan | length > 0

- name: Shutdown specified VLAN interfaces
  cisco.ios.ios_config:
    lines:
      - interface Vlan{{ item.key }}
      - shutdown
  loop: "{{ interfaces.vlan | dict2items | selectattr('value.shutdown', 'equalto', true) | list }}"
  when: interfaces.vlan is defined and interfaces.vlan | length > 0

- name: Configure shutdown ethernet interfaces
  cisco.ios.ios_config:
    lines:
      - interface {{ item.key }}
      - shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', true) | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0
- name: Configure Layer 3 ethernet interfaces with NAT
  cisco.ios.ios_config:
    lines:
      - interface {{ item.key }}
      - no switchport
      - description {{ item.value.description }}
      - ip address {{ item.value.ipv4 }} {{ item.value.mask }}
      - ip nat {{ item.value.nat }}
      - no shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', false) | selectattr('value.switchport', 'equalto', 'none') | selectattr('value.nat', 'defined') | rejectattr('value.nat', 'equalto', 'none') | rejectattr('value.nat', 'none') | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0

- name: Configure Layer 3 ethernet interfaces without NAT
  cisco.ios.ios_config:
    lines:
      - interface {{ item.key }}
      - no switchport
      - description {{ item.value.description }}
      - ip address {{ item.value.ipv4 }} {{ item.value.mask }}
      - no shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', false) | selectattr('value.switchport', 'equalto', 'none') | rejectattr('value.nat', 'defined') | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0

- name: Configure trunk ethernet interfaces
  cisco.ios.ios_config:
    lines:
      - interface {{ item.key }}
      - switchport
      - description {{ item.value.description }}
      - switchport trunk encapsulation dot1q
      - switchport mode trunk
      - switchport trunk allowed vlan {{ item.value.vlans | join(',') }}
      - no shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', false) | selectattr('value.switchport', 'equalto', 'trunk') | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0

- name: Configure access ethernet interfaces
  cisco.ios.ios_config:
    lines:
      - interface {{ item.key }}
      - switchport
      - description {{ item.value.description }}
      - switchport mode access
      - switchport access vlan {{ item.value.vlan }}
      - no shutdown
  loop: "{{ interfaces.ethernet | dict2items | selectattr('value.shutdown', 'equalto', false) | selectattr('value.switchport', 'equalto', 'access') | list }}"
  when: interfaces.ethernet is defined and interfaces.ethernet | length > 0
